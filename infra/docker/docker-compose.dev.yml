services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python
    command: ["uvicorn", "mcp_ops_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mcp_ops}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENSEARCH_URL: http://opensearch:9200
      MCP_GATEWAY_URL: http://mcp-gateway:8002
      MCP_GATEWAY_CLIENT_MODE: remote
      MCP_GATEWAY_TIMEOUT_SECONDS: ${MCP_GATEWAY_TIMEOUT_SECONDS:-10}
      MCP_GATEWAY_TRANSPORT_RETRIES: ${MCP_GATEWAY_TRANSPORT_RETRIES:-1}
      SERVICE_AUTH_SHARED_SECRET: ${SERVICE_AUTH_SHARED_SECRET:-change-me-local-only}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_PLANNER_PROVIDER: ${LLM_PLANNER_PROVIDER:-deterministic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      TOOL_DISCOVERY_INDEX_BACKEND: ${TOOL_DISCOVERY_INDEX_BACKEND:-memory}
      KNOWLEDGE_INDEX_BACKEND: ${KNOWLEDGE_INDEX_BACKEND:-memory}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      GITHUB_ALLOWED_REPOSITORIES: ${GITHUB_ALLOWED_REPOSITORIES:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python
    command:
      [
        "uvicorn",
        "mcp_ops_simulator.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python
    command:
      [
        "uvicorn",
        "mcp_ops_mcp_gateway.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
      ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      SERVICE_AUTH_SHARED_SECRET: ${SERVICE_AUTH_SHARED_SECRET:-change-me-local-only}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:80"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_ops}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: abcdefghijklmnopqrstuv
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 8

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 8

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  opensearch-data:
  grafana-data:
