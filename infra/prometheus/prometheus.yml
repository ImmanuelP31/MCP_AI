global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: mcp-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-gateway:8010"]
  - job_name: simulator-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["simulator-gateway:8020"]
