[project]
name = "mcp-engineering-ops"
version = "0.1.0"
description = "MCP Engineering Operations and Diagnostics Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "mcp>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.30.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "bandit[toml]>=1.7.10",
  "pip-audit>=2.7.3",
]

[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "apps/api/src",
  "packages/auth/src",
  "packages/common/src",
  "packages/mcp/src",
  "packages/observability/src",
  "packages/policy/src",
  "packages/schemas/src",
  "services/device-mcp/src",
  "services/diagnostics-mcp/src",
  "services/ai-agent/src",
  "services/knowledge-mcp/src",
  "services/mcp-gateway/src",
  "services/repository-mcp/src",
  "services/simulator-gateway/src",
  "services/ticket-mcp/src",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/security"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
exclude_dirs = [
  "apps/frontend/node_modules",
  "apps/frontend/dist",
  "apps/frontend/test-results",
]
skips = ["B101"]
